; Biru Buttons firmware
; Breadboard stage on a classic ESP-WROOM-32 devkit. The final build targets
; the ESP32-C3 SuperMini (see ../PLAN.md) — switch the [env] when it arrives.
;
; SAFETY: the default env talks ONLY to the local mock server
; (tools/mock_ingest.py) — no database is ever touched. The real API is
; reached only by building the explicit *-live env:
;   pio run -e wroom32-live -t upload   # ← the only way presses reach the book

[platformio]
default_envs = wroom32

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; BIRU_API_URL: where presses are POSTed. Default = the mock on this laptop.
; Change the IP to whatever tools/mock_ingest.py prints on startup.
build_flags =
  '-DBIRU_API_URL="http://192.168.1.254:8081"'
  -DBIRU_MOCK=1

[env:wroom32]
platform = espressif32
board = esp32dev

[env:c3]
platform = espressif32
board = lolin_c3_mini
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

; Live: presses land in the real book. Only build this deliberately:
;   pio run -e wroom32-live -t upload
; The board must be paired first (claim code from the Family page — see README).
[env:wroom32-live]
platform = espressif32
board = esp32dev
build_flags =
  '-DBIRU_API_URL="https://api-production-3d76.up.railway.app"'
  -DBIRU_MOCK=0
