<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" font-family="Georgia, serif">
  <rect width="840" height="560" fill="#F7F1E3"/>
  <text x="40" y="52" font-size="30" fill="#3E3428" font-weight="bold">design 04 · the bone wedge</text>
  <text x="40" y="78" font-size="15" fill="#8B6F52">a dog-bone console at a 15° typing angle · desk / shelf · USB-C · 150 × 58 × 32→18 mm</text>

  <!-- ══ top view ══ -->
  <text x="40" y="130" font-size="13" fill="#A99B85" letter-spacing="2">TOP</text>
  <g transform="translate(60,160)">
    <!-- bone shape: two lobed ends + bar -->
    <g stroke="#3E3428" stroke-width="4" fill="#FFF8EA">
      <circle cx="40" cy="40" r="38"/>
      <circle cx="40" cy="94" r="38"/>
      <circle cx="320" cy="40" r="38"/>
      <circle cx="320" cy="94" r="38"/>
      <rect x="40" y="14" width="280" height="106" stroke="none"/>
      <line x1="40" y1="14" x2="320" y2="14"/>
      <line x1="40" y1="120" x2="320" y2="120"/>
    </g>
    <!-- three round buttons along the bar -->
    <g>
      <circle cx="120" cy="67" r="34" fill="#C0533E" stroke="#3E3428" stroke-width="4"/>
      <text x="120" y="79" font-size="26" text-anchor="middle">💩</text>
    </g>
    <g>
      <circle cx="196" cy="67" r="34" fill="#D9A62B" stroke="#3E3428" stroke-width="4"/>
      <text x="196" y="79" font-size="26" text-anchor="middle">💛</text>
    </g>
    <g>
      <circle cx="272" cy="67" r="34" fill="#6E8F5B" stroke="#3E3428" stroke-width="4"/>
      <text x="272" y="79" font-size="26" text-anchor="middle">🍚</text>
    </g>
    <!-- LED in the left lobe -->
    <circle cx="40" cy="67" r="7" fill="#C0533E"/>
    <text x="40" y="92" font-size="10" text-anchor="middle" fill="#A99B85">LED</text>
  </g>

  <!-- ══ side profile ══ -->
  <text x="480" y="130" font-size="13" fill="#A99B85" letter-spacing="2">SIDE</text>
  <g transform="translate(500,220)">
    <!-- wedge -->
    <path d="M 0 90 L 0 60 L 280 28 L 280 90 Z" fill="#FFF8EA" stroke="#3E3428" stroke-width="4"/>
    <!-- buttons following the slope -->
    <ellipse cx="80" cy="53" rx="30" ry="12" fill="#D46A55" stroke="#3E3428" stroke-width="4" transform="rotate(-6 80 53)"/>
    <ellipse cx="150" cy="45" rx="30" ry="12" fill="#E8BC55" stroke="#3E3428" stroke-width="4" transform="rotate(-6 150 45)"/>
    <ellipse cx="220" cy="37" rx="30" ry="12" fill="#85A671" stroke="#3E3428" stroke-width="4" transform="rotate(-6 220 37)"/>
    <rect x="278" y="66" width="14" height="12" rx="4" fill="#3E3428"/>
    <text x="312" y="76" font-size="12" fill="#8B6F52">USB-C</text>
    <text x="140" y="112" font-size="12" fill="#A99B85" text-anchor="middle">15° slope faces the presser · tall edge at the back</text>
    <!-- angle mark -->
    <path d="M 40 86 A 34 34 0 0 0 36 74" fill="none" stroke="#A99B85" stroke-width="1.5"/>
    <text x="52" y="80" font-size="11" fill="#A99B85">15°</text>
  </g>

  <!-- notes -->
  <g transform="translate(40,440)" font-size="14" fill="#5B4A33">
    <text y="0" font-weight="bold" fill="#3E3428">why this one</text>
    <text y="24">· the bone reads "dog thing" from across the room without leaning on the app's paper look</text>
    <text y="46">· angled face makes the icons visible from standing height — best ergonomics of the set</text>
    <text y="68">· roomiest interior: easiest wiring, and the natural home for the v2 battery + charger</text>
    <text y="90" fill="#A67856">tradeoffs: longest print (~150 mm) · flat-back printing needs the lobes split or light supports</text>
  </g>
</svg>
